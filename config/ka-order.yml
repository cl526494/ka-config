server:
  port: 10000

spring:
  application:
    name: ka-order
  # 链路追踪
  sleuth:
    enabled: true
    sampler:
      # 采样率 (1.0 表示 100% 追踪请求)
      probability: 1.0
  # kafka
  kafka:
    bootstrap-servers: kafka01.docker.com:9092,kafka02.docker.com:9093,kafka03.docker.com:9094
    producer:
      acks: 1
      retries: 1
    consumer:
      auto-offset-reset: latest
      max-poll-records: 1
      enable-auto-commit: true
      auto-commit-interval: 1000
    listener:
      concurrency: 3
    admin:
      properties:
        metadata.max.age.ms: 100000

  # redis
  redis:
    host: redis.docker.com
    database: 0
    jedis:
      pool:
        max-active: 2000
        max-idle: 20
    port: 6379

httpclient:
  read-timeout: 10

logging:
  level:
    root: warn
    com.cl.ka: debug
